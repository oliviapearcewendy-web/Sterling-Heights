<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | Sterling Heights</title><link rel="stylesheet" href="../css/style.css"><script defer src="../js/app.js"></script></head><body><main class="form-page"><aside class="form-visual"><a class="logo" href="../index.html">STERLING<span>HEIGHTS</span></a><h2>Find a place that feels like you.</h2><p class="eyebrow light">THOUGHTFULLY DESIGNED. BEAUTIFULLY BUILT.</p></aside><section class="form-area"><form class="form-box" id="signupForm"><a class="back" href="../index.html">← Back to Sterling Heights</a><p class="eyebrow">YOUR NEXT CHAPTER</p><h1>Create your account</h1><p class="subtext">Join us to keep exploring our projects and properties.</p><label class="field"><span>Full name</span><input name="fullName" autocomplete="name" placeholder="Your full name" required></label><label class="field"><span>Email address</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field"><span>Password</span><input name="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></label><label class="field"><span>Confirm password</span><input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required></label><p class="form-error" id="formError" role="alert"></p><button class="btn dark form-submit" type="submit">Create account ↗</button><p class="form-note">Already have an account? <a href="login.html">Log in</a></p></form></section></main></body></html>
